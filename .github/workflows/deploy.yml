name: Frontend ECS Deployment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main   # prod
      - stage  # stage
      - dev    # dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-central-1
      ECR_REGISTRY: 457087769501.dkr.ecr.eu-central-1.amazonaws.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set-env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "ECR_REPOSITORY=uiux/prod/decoded" >> $GITHUB_OUTPUT
            echo "CLUSTER_NAME=<TODO_PROD_CLUSTER>" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=<TODO_PROD_SERVICE>" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/stage" ]; then
            echo "ENVIRONMENT=stage" >> $GITHUB_OUTPUT
            echo "ECR_REPOSITORY=uiux/stage/decoded" >> $GITHUB_OUTPUT
            echo "CLUSTER_NAME=<TODO_STAGE_CLUSTER>" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=<TODO_STAGE_SERVICE>" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
            echo "ECR_REPOSITORY=uiux/dev/decoded" >> $GITHUB_OUTPUT
            echo "CLUSTER_NAME=dev-amplify-decoded" >> $GITHUB_OUTPUT
            echo "SERVICE_NAME=dev-amplify-decoded-frontend-service-3uc4av61" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::457087769501:role/AICOE-Roles_OpenID_Connect
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REPOSITORY: ${{ steps.set-env.outputs.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f Dockerfile .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS
        env:
          ENVIRONMENT: ${{ steps.set-env.outputs.ENVIRONMENT }}
          CLUSTER_NAME: ${{ steps.set-env.outputs.CLUSTER_NAME }}
          SERVICE_NAME: ${{ steps.set-env.outputs.SERVICE_NAME }}
        run: |
          echo "Deploying to $ENVIRONMENT (cluster=$CLUSTER_NAME, service=$SERVICE_NAME)"
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region $AWS_REGION
